# Preview server for the Discovery wiki.
#
# The CSP comes from nginx-wiki-csp.conf, generated by wiki/scripts/gen-csp.mjs
# from the built output. Astro's native security.csp was tried first and does
# not work with Starlight: it hashes only the scripts that pass through Astro's
# own pipeline, so the six Starlight injects directly were blocked by the policy
# Astro itself emitted. Hashing the real dist/ cannot miss any, and a header
# rather than a meta tag means frame-ancestors is honoured.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects only: an absolute one would be built from nginx's own
    # listen address and point the visitor at 127.0.0.1.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    include /etc/nginx/conf.d/nginx-wiki-csp.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    # Pagefind ships a lot of small fragment files; they compress well.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/json;

    access_log off;
}
