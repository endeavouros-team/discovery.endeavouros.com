# Preview server for the Discovery wiki.
#
# Deliberately does NOT send a Content-Security-Policy header. Astro generates a
# per-page CSP meta tag for this site, hashing every inline script Starlight
# emits (~40 per build). A second policy from nginx would intersect with that
# one and break the pages, since the two carry different hash sets.
#
# Every other header is the same as the main site's.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects only: an absolute one would be built from nginx's own
    # listen address and point the visitor at 127.0.0.1.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    # Pagefind ships a lot of small fragment files; they compress well.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/json;

    access_log off;
}
