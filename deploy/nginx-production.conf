# Production server config for discovery.endeavouros.com.
#
# Derived from preview/nginx-preview.conf, which is where every rule below was
# exercised before it came here. The two files differ only in what is about
# *being a preview*: this one indexes, caches properly, keeps access logs, and
# answers the old WordPress permalinks.
#
# Every line marked CONFIRM must be checked against the box before this is
# loaded -- the webroot, the server_name, the TLS certificate paths, and what
# else is currently answering for discovery.endeavouros.com. Everything else is
# correct as written and should not be edited casually -- in particular the two
# generated includes, nginx-csp.conf and nginx-redirects.conf, which `make
# verify` and CI both re-derive from the build and the export. Editing either by
# hand fails the next check rather than silently blocking a script or stranding
# a redirect.
#
# CONFIRM: the WordPress vhost answering for discovery.endeavouros.com is
# disabled as this loads. Two server blocks claiming one name is resolved by
# include order, not by intent, and the loser fails silently -- so a half-done
# cutover looks like nothing happened rather than like an error. The old install
# is also what serves the dated permalinks today; the map below takes that job
# over, and both cannot be live at once.

# The redirects from the WordPress URLs. Generated by scripts/gen-redirects.py
# from the export's permalinks; a `map` is http-context, so this include sits
# outside the server blocks and must stay here.
#
# CONFIRM: the path. This is where the CSP snippet already lives on the preview
# host; a distribution that keeps site configs in sites-available wants both
# files beside this one instead.
include /etc/nginx/conf.d/nginx-redirects.conf;

# Plain HTTP exists only to send everyone to HTTPS. HSTS below means a browser
# that has been here once will not use this block again.
server {
    listen 80;
    listen [::]:80;
    # CONFIRM: the name, and that DNS for it points here. There is no www for
    # this host and none is claimed -- the main site's config redirects its own.
    server_name discovery.endeavouros.com;

    # Certbot writes its challenge files here and must keep working, or renewal
    # silently stops and the certificate expires 90 days later.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://discovery.endeavouros.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # CONFIRM: server_name.
    server_name discovery.endeavouros.com;

    # CONFIRM: the webroot the release tarball is unpacked into. This must be a
    # directory that holds ONLY the static build -- see the README on why the
    # rsync uses --delete. It must not be the WordPress install's root.
    root /var/www/discovery.endeavouros.com;
    index index.html;

    # CONFIRM: certbot's standard paths, and that the certificate covers
    # discovery.endeavouros.com. If the name has only ever been served by the
    # WordPress box under its own lineage, this is the line that will be wrong.
    # If TLS is terminated somewhere else, delete every server block's
    # listen/ssl lines and keep the rest.
    ssl_certificate     /etc/letsencrypt/live/discovery.endeavouros.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discovery.endeavouros.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Nothing here is version-specific, so the version number in the banner and
    # on error pages is only ever useful to somebody shopping for a target.
    server_tokens off;

    # Relative redirects only: an absolute one would be built from nginx's own
    # listen address rather than from this name.
    absolute_redirect off;

    # The WordPress permalinks. $discovery_redirect is empty for everything that
    # was never a WordPress URL, so this costs one variable lookup per request
    # and rewrites nothing else. `if` is safe here because the body is a bare
    # return -- that is the one form of it that is not evil.
    if ($discovery_redirect) {
        return 301 $discovery_redirect;
    }

    # Astro fingerprints every filename under /_astro/, so the content at a
    # given URL can never change and these are safe to cache forever. This is
    # the single biggest difference between this config and the preview, which
    # deliberately caches nothing so reviewers always see a fresh deploy.
    #
    # Only /_astro/. Pagefind's index and fragments under /pagefind/ are NOT
    # fingerprinted -- they are rewritten in place by every build -- so caching
    # them immutably would leave search answering from the previous release.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header replaces the inherited set within a block rather than
        # adding to it, so this has to repeat EVERY header the server scope
        # sets below -- a header listed there and omitted here is simply not
        # sent for assets. That includes the generated CSP, which is why the
        # snippet is included twice rather than copied once.
        include /etc/nginx/conf.d/nginx-csp.conf;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # CONFIRM: the path, as above. Generated by astro/scripts/gen-csp.mjs from
    # the built output and committed; the preview includes the same file.
    include /etc/nginx/conf.d/nginx-csp.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # No X-Robots-Tag. The preview sends `noindex, nofollow` and that header is
    # the one line that must not travel here: it would keep the wiki out of
    # search silently, with every page otherwise perfect. The build's
    # PUBLIC_INDEXABLE flag is the other half of the same promise.

    # Access logs stay ON, unlike the preview, because logs are how the next
    # compromise gets diagnosed -- the WordPress install this replaces was
    # hijacked, and it was users who noticed. Keep logrotate on this host at or
    # under the 90 days the main site's privacy policy promises.
    access_log /var/log/nginx/discovery.endeavouros.com.access.log;
    error_log  /var/log/nginx/discovery.endeavouros.com.error.log;

    # Pagefind ships a lot of small fragment files; they compress well.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/json;

    # No PHP handler, no admin path, nothing writable. If a location block for
    # any of those ever appears in this file, something has gone wrong: the
    # whole premise of the rebuild is that there is no interpreter to reach.
}
